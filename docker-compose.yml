services:
  lolesportscalendar:
    image: ${DOCKER_REGISTRY-}lolesportscalendar
    build:
      context: .
      dockerfile: LolEsportsCalendar/Dockerfile
      tags:
        - ${DOCKER_REGISTRY-}/lolesportscalendar:latest
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
          - linux/arm64/v8

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "admin"
    volumes:
      - ./data:/data
    ports:
      - "5341:5341"
      - "8080:80"
    restart: unless-stopped
